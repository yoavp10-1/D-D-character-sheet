      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

            window.location.protocol === 'file:')) ||

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:100%;}\ninput,textarea,button{font-family:inherit;}\ntextarea{resize:vertical;}\n::placeholder{color:#b6a684;font-style:italic;}\nbutton:disabled{opacity:.3;cursor:not-allowed;}\ninput:read-only,textarea:read-only{background:#ece0c0 !important;border-color:#d9cba6 !important;cursor:default;box-shadow:none;}\ninput[type=number]::-webkit-inner-spin-button{opacity:.4;}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;padding:0 0 40px;background:radial-gradient(120% 60% at 50% 0%,#f2e6c8 0%,#e7d8b4 45%,#dcc99f 100%);font-family:'EB Garamond',serif;color:#2f2417;\">\n  <div style=\"max-width:600px;margin:0 auto;padding:0 15px;\">\n\n    <header style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:28px 4px 16px;border-bottom:2px solid #b89b6d;margin-bottom:20px;\">\n      <div style=\"min-width:0;\">\n        <div style=\"font:600 11px/1 'Cinzel',serif;letter-spacing:3px;text-transform:uppercase;color:#86796a;\">Character Codex<\u002Fdiv>\n        <h1 style=\"margin:7px 0 0;font:700 27px/1.05 'Cinzel',serif;color:#2f2417;word-break:break-word;\">{{ sheet.headerTitle }}<\u002Fh1>\n        <sc-if value=\"{{ sheet.hasSub }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:5px;font:italic 500 14px 'EB Garamond',serif;color:#7a6a4c;\">{{ sheet.headerSub }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ toggleEdit }}\" style=\"flex:none;padding:11px 20px;border:1.5px solid #2f93b8;background:#2f93b8;color:#fff;border-radius:9px;font:600 12px 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;box-shadow:0 2px 6px rgba(47,147,184,.3);\" style-hover=\"background:#1f6f8f;border-color:#1f6f8f;\">{{ editLabel }}<\u002Fbutton>\n    <\u002Fheader>\n\n    <sc-if value=\"{{ editMode }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-bottom:16px;padding:9px 13px;background:#eaf6fb;border:1px solid #bfe0ec;border-radius:9px;font:600 11px 'Cinzel',serif;letter-spacing:1px;text-transform:uppercase;color:#1f6f8f;text-align:center;\">◆ Editing — all fields unlocked ◆<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px;\">\n\n      <!-- IDENTITY -->\n      <section style=\"background:#f7efda;border:1px solid #cbb287;border-radius:11px;overflow:hidden;box-shadow:0 1px 0 #fffaf0 inset,0 3px 10px rgba(60,40,15,.10);\">\n        <div style=\"display:flex;align-items:center;gap:9px;padding:12px 15px;background:linear-gradient(#efe2c2,#e6d6b1);border-bottom:1px solid #cbb287;\"><span style=\"color:#2f93b8;font-size:12px;\">◆<\u002Fspan><h2 style=\"margin:0;flex:1;font:600 14px/1.2 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#3a2c1a;\">Character<\u002Fh2><\u002Fdiv>\n        <div style=\"padding:14px;display:flex;flex-direction:column;gap:12px;\">\n          <div>\n            <label style=\"font:600 9px/1.4 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#8a7a5a;display:block;margin-bottom:4px;\">Character Name<\u002Flabel>\n            <input value=\"{{ sheet.charName }}\" sc-camel-on-change=\"{{ sheet.onCharName }}\" sc-camel-read-only=\"{{ sheet.locked }}\" placeholder=\"Name your hero\" style=\"width:100%;font:600 18px 'EB Garamond',serif;color:#2f2417;background:#fffdf6;border:1px solid #cbb287;border-radius:6px;padding:9px 11px;\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"font:600 9px/1.4 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#8a7a5a;display:block;margin-bottom:5px;\">Class &amp; Level<\u002Flabel>\n            <div style=\"display:flex;flex-direction:column;gap:7px;\">\n              <sc-for list=\"{{ sheet.classes }}\" as=\"cls\" hint-placeholder-count=\"1\">\n                <div style=\"display:flex;gap:7px;align-items:center;\">\n                  <input value=\"{{ cls.name }}\" sc-camel-on-change=\"{{ cls.onName }}\" sc-camel-read-only=\"{{ sheet.locked }}\" placeholder=\"Class\" style=\"flex:1;min-width:0;font:500 15px 'EB Garamond',serif;color:#2f2417;background:#fffdf6;border:1px solid #cbb287;border-radius:6px;padding:8px 10px;\">\n                  <input value=\"{{ cls.level }}\" sc-camel-on-change=\"{{ cls.onLevel }}\" sc-camel-read-only=\"{{ sheet.locked }}\" placeholder=\"Lv\" inputmode=\"numeric\" style=\"width:62px;text-align:center;font:500 15px 'EB Garamond',serif;color:#2f2417;background:#fffdf6;border:1px solid #cbb287;border-radius:6px;padding:8px 6px;\">\n                  <sc-if value=\"{{ cls.canRemove }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button sc-camel-on-click=\"{{ cls.onRemove }}\" title=\"Remove class\" style=\"flex:none;width:34px;height:36px;border:1.5px solid #b06a52;background:#fbeee9;color:#8a3d28;border-radius:6px;font:600 16px/1 'EB Garamond',serif;cursor:pointer;\">×<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ editMode }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ sheet.addClass }}\" style=\"align-self:flex-start;padding:7px 12px;border:1.5px dashed #bfa877;background:transparent;color:#7c6a4a;border-radius:7px;font:600 11px 'Cinzel',serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer;\">+ Add class (multiclass)<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:11px;\">\n            <div><label style=\"font:600 9px/1.4 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#8a7a5a;display:block;margin-bottom:4px;\">Background<\u002Flabel><input value=\"{{ sheet.background }}\" sc-camel-on-change=\"{{ sheet.onBackground }}\" sc-camel-read-only=\"{{ sheet.locked }}\" style=\"width:100%;font:500 15px 'EB Garamond',serif;color:#2f2417;background:#fffdf6;border:1px solid #cbb287;border-radius:6px;padding:8px 10px;\"><\u002Fdiv>\n            <div><label style=\"font:600 9px/1.4 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#8a7a5a;display:block;margin-bottom:4px;\">Player Name<\u002Flabel><input value=\"{{ sheet.playerName }}\" sc-camel-on-change=\"{{ sheet.onPlayerName }}\" sc-camel-read-only=\"{{ sheet.locked }}\" style=\"width:100%;font:500 15px 'EB Garamond',serif;color:#2f2417;background:#fffdf6;border:1px solid #cbb287;border-radius:6px;padding:8px 10px;\"><\u002Fdiv>\n            <div><label style=\"font:600 9px/1.4 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#8a7a5a;display:block;margin-bottom:4px;\">Race<\u002Flabel><input value=\"{{ sheet.race }}\" sc-camel-on-change=\"{{ sheet.onRace }}\" sc-camel-read-only=\"{{ sheet.locked }}\" style=\"width:100%;font:500 15px 'EB Garamond',serif;color:#2f2417;background:#fffdf6;border:1px solid #cbb287;border-radius:6px;padding:8px 10px;\"><\u002Fdiv>\n            <div><label style=\"font:600 9px/1.4 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#8a7a5a;display:block;margin-bottom:4px;\">Alignment<\u002Flabel><input value=\"{{ sheet.alignment }}\" sc-camel-on-change=\"{{ sheet.onAlignment }}\" sc-camel-read-only=\"{{ sheet.locked }}\" style=\"width:100%;font:500 15px 'EB Garamond',serif;color:#2f2417;background:#fffdf6;border:1px solid #cbb287;border-radius:6px;padding:8px 10px;\"><\u002Fdiv>\n            <div style=\"grid-column:1 / -1;\"><label style=\"font:600 9px/1.4 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#8a7a5a;display:block;margin-bottom:4px;\">Experience Points<\u002Flabel><input value=\"{{ sheet.xp }}\" sc-camel-on-change=\"{{ sheet.onXp }}\" sc-camel-read-only=\"{{ sheet.locked }}\" inputmode=\"numeric\" style=\"width:100%;font:500 15px 'EB Garamond',serif;color:#2f2417;background:#fffdf6;border:1px solid #cbb287;border-radius:6px;padding:8px 10px;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ABILITY SCORES -->\n      <section style=\"background:#f7efda;border:1px solid #cbb287;border-radius:11px;overflow:hidden;box-shadow:0 1px 0 #fffaf0 inset,0 3px 10px rgba(60,40,15,.10);\">\n        <div style=\"display:flex;align-items:center;gap:9px;padding:12px 15px;background:linear-gradient(#efe2c2,#e6d6b1);border-bottom:1px solid #cbb287;\"><span style=\"color:#2f93b8;font-size:12px;\">◆<\u002Fspan><h2 style=\"margin:0;flex:1;font:600 14px/1.2 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#3a2c1a;\">Ability Scores<\u002Fh2><\u002Fdiv>\n        <div style=\"padding:14px;\">\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:9px;\">\n            <sc-for list=\"{{ sheet.scores }}\" as=\"score\" hint-placeholder-count=\"6\">\n              <div style=\"background:#fffdf6;border:1px solid #d8c9a2;border-radius:10px;padding:9px 6px 10px;text-align:center;\">\n                <div style=\"font:600 9px/1.2 'Cinzel',serif;letter-spacing:1px;text-transform:uppercase;color:#8a7a5a;\">{{ score.label }}<\u002Fdiv>\n                <div style=\"font:700 27px/1 'Cinzel',serif;color:#1f6f8f;margin:3px 0 6px;\">{{ score.mod }}<\u002Fdiv>\n                <input value=\"{{ score.score }}\" sc-camel-on-change=\"{{ score.onScore }}\" sc-camel-read-only=\"{{ sheet.locked }}\" inputmode=\"numeric\" style=\"width:54px;text-align:center;font:600 15px 'EB Garamond',serif;color:#2f2417;background:#fffdf6;border:1px solid #cbb287;border-radius:6px;padding:5px;\">\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;\">\n            <div style=\"background:#fffdf6;border:1px solid #d8c9a2;border-radius:10px;padding:10px;text-align:center;\">\n              <div style=\"font:600 9px/1.2 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#8a7a5a;margin-bottom:7px;\">Inspiration<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:center;gap:9px;\">\n                <button sc-camel-on-click=\"{{ sheet.decInsp }}\" style=\"width:34px;height:34px;border:1.5px solid #2f93b8;background:#fff;color:#1f6f8f;border-radius:8px;font:600 20px/1 'EB Garamond',serif;cursor:pointer;flex:none;\">−<\u002Fbutton>\n                <span style=\"font:700 22px/1 'Cinzel',serif;color:#1f6f8f;min-width:26px;\">{{ sheet.inspiration }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ sheet.incInsp }}\" style=\"width:34px;height:34px;border:1.5px solid #2f93b8;background:#fff;color:#1f6f8f;border-radius:8px;font:600 20px/1 'EB Garamond',serif;cursor:pointer;flex:none;\">+<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fffdf6;border:1px solid #d8c9a2;border-radius:10px;padding:10px;text-align:center;\">\n              <div style=\"font:600 9px/1.2 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#8a7a5a;margin-bottom:7px;\">Proficiency Bonus<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:center;gap:9px;\">\n                <button sc-camel-on-click=\"{{ sheet.decPB }}\" style=\"width:34px;height:34px;border:1.5px solid #b89b6d;background:#f7efda;color:#6b5320;border-radius:8px;font:600 20px/1 'EB Garamond',serif;cursor:pointer;flex:none;\">−<\u002Fbutton>\n                <span style=\"font:700 22px/1 'Cinzel',serif;color:#6b5320;min-width:30px;\">{{ sheet.pbLabel }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ sheet.incPB }}\" style=\"width:34px;height:34px;border:1.5px solid #b89b6d;background:#f7efda;color:#6b5320;border-radius:8px;font:600 20px/1 'EB Garamond',serif;cursor:pointer;flex:none;\">+<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- SAVES + SKILLS -->\n      <section style=\"background:#f7efda;border:1px solid #cbb287;border-radius:11px;overflow:hidden;box-shadow:0 1px 0 #fffaf0 inset,0 3px 10px rgba(60,40,15,.10);\">\n        <div style=\"display:flex;align-items:center;gap:9px;padding:12px 15px;background:linear-gradient(#efe2c2,#e6d6b1);border-bottom:1px solid #cbb287;\"><span style=\"color:#2f93b8;font-size:12px;\">◆<\u002Fspan><h2 style=\"margin:0;flex:1;font:600 14px/1.2 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#3a2c1a;\">Saving Throws &amp; Skills<\u002Fh2><\u002Fdiv>\n        <div style=\"padding:14px;\">\n          <div style=\"font:600 10px/1 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#8a7a5a;margin-bottom:8px;\">Saving Throws<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:7px;\">\n            <sc-for list=\"{{ sheet.saves }}\" as=\"save\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;align-items:center;gap:8px;padding:6px 9px;background:#fffdf6;border:1px solid #e3d5b0;border-radius:8px;\">\n                <button sc-camel-on-click=\"{{ save.onToggle }}\" title=\"Toggle proficiency\" style=\"width:18px;height:18px;border-radius:50%;border:1.5px solid #2f93b8;background:#fffdf6;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;padding:0;\">\n                  <sc-if value=\"{{ save.prof }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:9px;height:9px;border-radius:50%;background:#2f93b8;display:block;\"><\u002Fspan><\u002Fsc-if>\n                <\u002Fbutton>\n                <span style=\"font:700 14px 'EB Garamond',serif;color:#1f6f8f;min-width:26px;text-align:center;\">{{ save.val }}<\u002Fspan>\n                <span style=\"font:500 13px 'EB Garamond',serif;color:#3a2c1a;flex:1;\">{{ save.label }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:8px;margin:16px 0 8px;flex-wrap:wrap;\">\n            <span style=\"font:600 10px/1 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#8a7a5a;\">Skills<\u002Fspan>\n            <sc-if value=\"{{ editMode }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font:italic 400 11px 'EB Garamond',serif;color:#9a8a6a;\">tap the circle: none → proficient → expertise<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:7px;\">\n            <sc-for list=\"{{ sheet.skills }}\" as=\"skill\" hint-placeholder-count=\"18\">\n              <div style=\"display:flex;align-items:center;gap:8px;padding:6px 9px;background:#fffdf6;border:1px solid #e3d5b0;border-radius:8px;\">\n                <button sc-camel-on-click=\"{{ skill.onToggle }}\" title=\"none / proficient / expertise\" style=\"width:18px;height:18px;border-radius:50%;border:1.5px solid #2f93b8;background:#fffdf6;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;padding:0;\">\n                  <sc-if value=\"{{ skill.profOnly }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:9px;height:9px;border-radius:50%;background:#2f93b8;display:block;\"><\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{ skill.exp }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:12px;height:12px;border-radius:50%;background:#c79a3e;box-shadow:0 0 0 1.5px #fffdf6, 0 0 0 3px #c79a3e;display:block;\"><\u002Fspan><\u002Fsc-if>\n                <\u002Fbutton>\n                <span style=\"font:700 14px 'EB Garamond',serif;color:#1f6f8f;min-width:26px;text-align:center;\">{{ skill.val }}<\u002Fspan>\n                <span style=\"font:500 12.5px 'EB Garamond',serif;color:#3a2c1a;flex:1;line-height:1.2;\">{{ skill.label }} <span style=\"color:#a2916d;font-size:10px;\">({{ skill.ability }})<\u002Fspan><\u002Fspan>\n                <sc-if value=\"{{ skill.exp }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"flex:none;font:700 8px 'Cinzel',serif;letter-spacing:1px;color:#a5761f;background:#f7ecd0;border:1px solid #e2c98a;border-radius:4px;padding:2px 4px;\">EXP<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px;padding:9px 12px;background:#edf7fb;border:1px solid #bfe0ec;border-radius:8px;display:flex;align-items:center;justify-content:space-between;\">\n            <span style=\"font:600 10px 'Cinzel',serif;letter-spacing:1px;text-transform:uppercase;color:#5e8a9b;\">Passive Wisdom (Perception)<\u002Fspan>\n            <span style=\"font:700 20px 'Cinzel',serif;color:#1f6f8f;\">{{ sheet.passivePerception }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- BATTLE STATS -->\n      <section style=\"background:#f7efda;border:1px solid #cbb287;border-radius:11px;overflow:hidden;box-shadow:0 1px 0 #fffaf0 inset,0 3px 10px rgba(60,40,15,.10);\">\n        <div style=\"display:flex;align-items:center;gap:9px;padding:12px 15px;background:linear-gradient(#efe2c2,#e6d6b1);border-bottom:1px solid #cbb287;\"><span style=\"color:#2f93b8;font-size:12px;\">◆<\u002Fspan><h2 style=\"margin:0;flex:1;font:600 14px/1.2 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#3a2c1a;\">Combat<\u002Fh2><\u002Fdiv>\n        <div style=\"padding:14px;display:flex;flex-direction:column;gap:12px;\">\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:9px;\">\n            <div style=\"background:#fffdf6;border:1px solid #d8c9a2;border-radius:10px;padding:9px 6px;text-align:center;\"><div style=\"font:600 9px/1.2 'Cinzel',serif;letter-spacing:1px;text-transform:uppercase;color:#8a7a5a;margin-bottom:5px;\">Armor Class<\u002Fdiv><input value=\"{{ sheet.ac }}\" sc-camel-on-change=\"{{ sheet.onAc }}\" sc-camel-read-only=\"{{ sheet.locked }}\" inputmode=\"numeric\" style=\"width:100%;text-align:center;font:700 18px 'Cinzel              <button sc-camel-on-click=\"{{ type.openAddMenu }}\" style=\"width:100%;padding:11px;border:1.5px dashed #bfa877;background:transparent;color:#7c6a4a;border-radius:8px;font:600 12px 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;\" style-hover=\"background:#f2e8cf;color:#5e4d2f;\">+ Add ability<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ type.showAddMenu }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:11px;border:1.5px dashed #bfa877;border-radius:8px;background:#f2e8cf;\">\n                <span style=\"width:100%;font:600 10px 'Cinzel',serif;letter-spacing:2px;text-transform:uppercase;color:#7c6a4a;\">Add which kind of ability?<\u002Fspan>\n                <button sc-camel-on-click=\"{{ type.addTracked }}\" style=\"padding:9px 13px;border:1.5px solid #2f93b8;background:#eaf6fb;color:#1f6f8f;border-radius:8px;font:600 13px 'EB Garamond',serif;cursor:pointer;\" style-hover=\"background:#dceff6;\">+ Tracked (current / max)<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ type.addOpen }}\" style=\"padding:9px 13px;border:1.5px solid #2f93b8;background:#eaf6fb;color:#1f6f8f;border-radius:8px;font:600 13px 'EB Garamond',serif;cursor:pointer;\" style-hover=\"background:#dceff6;\">+ Amount only (no max)<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ type.addSimple }}\" style=\"padding:9px 13px;border:1.5px solid #b89b6d;background:#f7efda;color:#6b5320;border-radius:8px;font:600 13px 'EB Garamond',serif;cursor:pointer;\" style-hover=\"background:#efe2c2;\">+ Simple (no uses)<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ type.cancelAdd }}\" style=\"padding:9px 11px;border:none;background:transparent;color:#8a7a5a;border-radius:8px;font:600 12px 'EB Garamond',serif;cursor:pointer;text-decoration:underline;\">Cancel<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-for>\n\n      <sc-if value=\"{{ editMode }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ addType }}\" style=\"width:100%;padding:15px;border:2px dashed #b89b6d;background:#f7efda;color:#6b5320;border-radius:11px;font:600 14px 'Cinzel',serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;\" style-hover=\"background:#efe2c2;\">+ Add Category<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fmain>\n\n    <sc-if value=\"{{ editMode }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ clearAll }}\" style=\"width:100%;margin-top:24px;padding:14px;border:1.5px solid #b06a52;background:#fbeee9;color:#8a3d28;border-radius:11px;font:600 12px 'Cinzel',serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;\" style-hover=\"background:#f6ddd4;\">Clear Everything<\u002Fbutton>\n    <\u002Fsc-if>\n\n    <section style=\"margin-top:26px;background:#f7efda;border:1px solid #cbb287;border-radius:11px;overflow:hidden;box-shadow:0 1px 0 #fffaf0 inset,0 3px 10px rgba(60,40,15,.10);\">\n      <div style=\"display:flex;align-items:center;gap:9px;padding:12px 15px;background:linear-gradient(#efe2c2,#e6d6b1);border-bottom:1px solid #cbb287;\"><span style=\"color:#2f93b8;font-size:12px;\">◆<\u002Fspan><h2 style=\"margin:0;flex:1;font:600 14px/1.2 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#3a2c1a;\">Saving &amp; Backup<\u002Fh2><\u002Fdiv>\n      <div style=\"padding:14px;display:flex;flex-direction:column;gap:12px;\">\n        <p style=\"margin:0;font:400 13.5px/1.5 'EB Garamond',serif;color:#5b4a33;text-wrap:pretty;\">Your character saves automatically in this browser — reopen this file on the same device and everything is here. To keep a copy in a file or move it to another device, use the buttons below.<\u002Fp>\n\n        <sc-if value=\"{{ supportsFS }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;padding:12px;background:#edf7fb;border:1px solid #bfe0ec;border-radius:9px;\">\n            <div style=\"font:600 10px 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#1f6f8f;\">Auto-save to a file<\u002Fdiv>\n            <sc-if value=\"{{ fileLinked }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:600 13px 'EB Garamond',serif;color:#1f6f8f;\">✓ Linked — every change now writes straight to your file.<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n              <button sc-camel-on-click=\"{{ linkAutoSaveFile }}\" style=\"padding:10px 14px;border:1.5px solid #2f93b8;background:#2f93b8;color:#fff;border-radius:8px;font:600 12px 'Cinzel',serif;letter-spacing:.5px;cursor:pointer;\">Auto-save to file…<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ openAutoSaveFile }}\" style=\"padding:10px 14px;border:1.5px solid #2f93b8;background:#eaf6fb;color:#1f6f8f;border-radius:8px;font:600 12px 'Cinzel',serif;letter-spacing:.5px;cursor:pointer;\">Open a save file…<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font:italic 400 12px 'EB Garamond',serif;color:#5e8a9b;\">Pick a file once; it keeps writing on its own while this tab is open.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div>\n          <div style=\"font:600 10px 'Cinzel',serif;letter-spacing:1.5px;text-transform:uppercase;color:#8a7a5a;margin-bottom:6px;\">Backup file — works on phone<\u002Fdiv>\n          <p style=\"margin:0 0 8px;font:400 12.5px/1.5 'EB Garamond',serif;color:#5b4a33;\">On a phone, <b>Save backup<\u002Fb> opens the share sheet so you can store the file in Files, iCloud, or Drive. <b>Restore<\u002Fb> loads it back on any device.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n            <button sc-camel-on-click=\"{{ downloadBackup }}\" style=\"padding:10px 14px;border:1.5px solid #b89b6d;background:#f7efda;color:#6b5320;border-radius:8px;font:600 12px 'Cinzel',serif;letter-spacing:.5px;cursor:pointer;\">Save backup<\u002Fbutton>\n            <label style=\"padding:10px 14px;border:1.5px solid #b89b6d;background:#f7efda;color:#6b5320;border-radius:8px;font:600 12px 'Cinzel',serif;letter-spacing:.5px;cursor:pointer;\">Restore backup<input type=\"file\" accept=\".json,application/json\" sc-camel-on-change=\"{{ restoreFromInput }}\" style=\"display:none;\"><\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer style=\"text-align:center;margin-top:22px;font:italic 400 13px 'EB Garamond',serif;color:#9a8a6a;\">\n      ◆ Changes save automatically ◆\n    <\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:950},&quot;denseMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sortTrackedFirst&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;confirmOnDelete&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { editMode: false, addMenuFor: null, types: this.load(), sheet: this.loadSheet(), fileLinked: false };\n    this._fh = null;\n  }\n\n  uid(p) { return (p || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }\n\n  ABILS() { return [['str','Strength'],['dex','Dexterity'],['con','Constitution'],['int','Intelligence'],['wis','Wisdom'],['cha','Charisma']]; }\n  SKILLS() { return [['acrobatics','Acrobatics','dex'],['animalHandling','Animal Handling','wis'],['arcana','Arcana','int'],['athletics','Athletics','str'],['deception','Deception','cha'],['history','History','int'],['insight','Insight','wis'],['intimidation','Intimidation','cha'],['investigation','Investigation','int'],['medicine','Medicine','wis'],['nature','Nature','int'],['perception','Perception','wis'],['performance','Performance','cha'],['persuasion','Persuasion','cha'],['religion','Religion','int'],['sleightOfHand','Sleight of Hand','dex'],['stealth','Stealth','dex'],['survival','Survival','wis']]; }\n\n  // ---------- Tome persistence ----------\n  load() {\n    let types = null;\n    try {\n      const raw = localStorage.getItem('dnd-abilities-v2');\n      if (raw) { const d = JSON.parse(raw); if (Array.isArray(d) && d.length) types = d; }\n    } catch (e) {}\n    if (!types) types = this.getDefault();\n    return this.migrate(types);\n  }\n  migrate(types) {\n    if (localStorage.getItem('dnd-spells-amount-v1')) return types;\n    const out = types.map(t => (t.name || '').trim().toLowerCase() !== 'spells' ? t : {\n      ...t,\n      abilities: t.abilities.map(a => a.hasCounter ? a : { ...a, hasCounter: true, noMax: true, amount: a.amount || 0, max: a.max || 0 })\n    });\n    try { localStorage.setItem('dnd-spells-amount-v1', '1'); } catch (e) {}\n    this.save(out);\n    return out;\n  }\n  save(types) { try { localStorage.setItem('dnd-abilities-v2', JSON.stringify(types)); } catch (e) {} }\n  setTypes(types) { this.setState({ types }); this.save(types); this.autoPersist(); }\n\n  updateAbility(tid, aid, fn) {\n    this.setTypes(this.state.types.map(t => t.id !== tid ? t : {\n      ...t, abilities: t.abilities.map(a => a.id !== aid ? a : fn({ ...a }))\n    }));\n  }\n  deleteAbility(tid, aid) {\n    this.setTypes(this.state.types.map(t => t.id !== tid ? t : { ...t, abilities: t.abilities.filter(a => a.id !== aid) }));\n  }\n  addAbility(tid, hasCounter, noMax) {\n    const open = hasCounter && noMax;\n    const a = { id: this.uid('a'), name: '', explanation: '', hasCounter: !!hasCounter, noMax: !!noMax, maxIsPB: false, amount: hasCounter ? (open ? 0 : 3) : 0, max: (hasCounter && !open) ? 3 : 0 };\n    this.setState({ addMenuFor: null });\n    this.setTypes(this.state.types.map(t => t.id !== tid ? t : { ...t, abilities: [...t.abilities, a] }));\n  }\n  renameType(tid, name) { this.setTypes(this.state.types.map(t => t.id !== tid ? t : { ...t, name })); }\n  moveType(tid, dir) {\n    const ts = [...this.state.types];\n    const i = ts.findIndex(t => t.id === tid); const j = i + dir;\n    if (i < 0 || j < 0 || j >= ts.length) return;\n    [ts[i], ts[j]] = [ts[j], ts[i]];\n    this.setTypes(ts);\n  }\n  moveAbility(tid, aid, dir) {\n    this.setTypes(this.state.types.map(t => {\n      if (t.id !== tid) return t;\n      const abs = [...t.abilities];\n      const i = abs.findIndex(a => a.id === aid); const j = i + dir;\n      if (i < 0 || j < 0 || j >= abs.length) return t;\n      [abs[i], abs[j]] = [abs[j], abs[i]];\n      return { ...t, abilities: abs };\n    }));\n  }\n  deleteType(tid) { this.setTypes(this.state.types.filter(t => t.id !== tid)); }\n  addType() { this.setTypes([...this.state.types, { id: this.uid('t'), name: '', abilities: [] }]); }\n\n  setMaxPB(tid, aid, val) {\n    const pb = Number(this.state.sheet.pb) || 0;\n    this.updateAbility(tid, aid, x => val ? { ...x, maxIsPB: true, max: pb, amount: Math.min(x.amount, pb) } : { ...x, maxIsPB: false });\n  }\n  clampTypesToPB(pb) {\n    const types = this.state.types.map(t => ({ ...t, abilities: t.abilities.map(a => a.maxIsPB ? { ...a, max: pb, amount: Math.min(a.amount, pb) } : a) }));\n    this.setTypes(types);\n  }\n\n  // ---------- Sheet persistence ----------\n  defaultSheet() {\n    return {\n      charName: '', classes: [{ id: this.uid('c'), name: 'Rogue', level: '' }], background: '', playerName: '', race: 'Goliath', alignment: '', xp: '',\n      scores: { str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 },\n      inspiration: 0, pb: 2,\n      saves: { str: false, dex: false, con: false, int: false, wis: false, cha: false },\n      skills: {},\n      ac: '', initiative: '', speed: '', maxHp: '', curHp: 0, tempHp: 0, hitDice: '',\n      deathSuccess: 0, deathFail: 0,\n      coins: { cp: '', sp: '', ep: '', gp: '', pp: '' },\n      items: [], otherProf: [],\n      personality: '', ideals: '', bonds: '', flaws: '',\n      spell: { cls: '', ability: '', saveDC: '', atk: '',\n        slots: { 1:{t:0,e:0},2:{t:0,e:0},3:{t:0,e:0},4:{t:0,e:0},5:{t:0,e:0},6:{t:0,e:0},7:{t:0,e:0},8:{t:0,e:0},9:{t:0,e:0} },\n        list: [] }\n    };\n  }\n  blankSheet() {\n    const d = this.defaultSheet();\n    d.classes = [{ id: this.uid('c'), name: '', level: '' }];\n    d.race = '';\n    return d;\n  }\n  loadSheet() {\n    try {\n      const raw = localStorage.getItem('dnd-sheet-v1');\n      if (raw) { const s = JSON.parse(raw); if (s && typeof s === 'object') return this.mergeSheet(s); }\n    } catch (e) {}\n    return this.defaultSheet();\n  }\n  mergeSheet(s) {\n    const d = this.defaultSheet();\n    const sp = s.spell || {};\n    return {\n      ...d, ...s,\n      classes: (s.classes && s.classes.length) ? s.classes : d.classes,\n      scores: { ...d.scores, ...(s.scores || {}) },\n      saves: { ...d.saves, ...(s.saves || {}) },\n      skills: (() => { const raw = s.skills || {}, out = {}; Object.keys(raw).forEach(k => { const v = raw[k]; out[k] = (v === 2 || v === 'expertise') ? 2 : ((v === true || v === 1 || v === 'prof') ? 1 : 0); }); return out; })(),\n      coins: { ...d.coins, ...(s.coins || {}) },\n      items: s.items || [], otherProf: s.otherProf || [],\n      spell: { ...d.spell, ...sp, slots: { ...d.spell.slots, ...(sp.slots || {}) }, list: sp.list || [] }\n    };\n  }\n  saveSheet(sheet) { try { localStorage.setItem('dnd-sheet-v1', JSON.stringify(sheet)); } catch (e) {} }\n  setSheet(sheet) { this.setState({ sheet }); this.saveSheet(sheet); this.autoPersist(); }\n\n  // ---------- File save / restore ----------\n  serialize() { return JSON.stringify({ app: 'tome-of-abilities', v: 1, savedAt: new Date().toISOString(), sheet: this.state.sheet, types: this.state.types }, null, 2); }\n  fileName() { const n = (this.state.sheet.charName || '').trim() || 'character'; return n.replace(/[^\\w \\-]+/g, '').trim() || 'character'; }\n\n  autoPersist() {\n    if (!this._fh) return;\n    clearTimeout(this._pt);\n    this._pt = setTimeout(() => this.writeHandle(), 400);\n  }\n  async writeHandle() {\n    if (!this._fh) return;\n    try { const w = await this._fh.createWritable(); await w.write(this.serialize()); await w.close(); }\n    catch (e) { /* permission lost or user removed file */ }\n  }\n  applyData(d) {\n    if (!d || typeof d !== 'object') return false;\n    if (d.sheet) { const sheet = this.mergeSheet(d.sheet); this.setState({ sheet }); this.saveSheet(sheet); }\n    if (Array.isArray(d.types)) { this.setState({ types: d.types }); this.save(d.types); }\n    return !!(d.sheet || d.types);\n  }\n\n  async downloadBackup() {\n    const data = this.serialize();\n    const fname = this.fileName() + ' - save.json';\n    // On phones, try the native share sheet first (save to Files / iCloud / Drive).\n    try {\n      const file = new File([data], fname, { type: 'application/json' });\n      if (navigator.canShare && navigator.canShare({ files: [file] })) {\n        await navigator.share({ files: [file], title: fname });\n        return; // shared successfully\n      }\n    } catch (e) {\n      // User cancelled the share sheet -> stop. Any other error -> fall back to download.\n      if (e && e.name === 'AbortError') return;\n    }\n    this.fallbackDownload(data, fname);\n  }\n  fallbackDownload(data, fname) {\n    try {\n      const blob = new Blob([data], { type: 'application/json' });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url; a.download = fname; a.rel = 'noopener';\n      document.body.appendChild(a); a.click();\n      setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);\n    } catch (e) {\n      // Last resort: open the JSON in a new tab so the user can save it manually.\n      try {\n        const w = window.open('', '_blank');\n        if (w) { w.document.title = fname; w.document.body.style.cssText = 'white-space:pre-wrap;font-family:monospace;padding:16px'; w.document.body.textContent = data; }\n        else alert('Could not start the download. Please allow downloads/pop-ups for this page and try again.');\n      } catch (e2) { alert('Could not start the download on this device.'); }\n    }\n  }\n  restoreFromInput(e) {\n    const f = e.target.files && e.target.files[0]; e.target.value = '';\n    if (!f) return;\n    const r = new FileReader();\n    r.onload = () => { try { const d = JSON.parse(r.result); if (this.applyData(d)) alert('Character restored from backup.'); else alert('That file did not contain a character save.'); } catch (err) { alert('Could not read that file \\u2014 it is not a valid save file.'); } };\n    r.readAsText(f);\n  }\n  async linkAutoSaveFile() {\n    if (!('showSaveFilePicker' in window)) return;\n    try {\n      const h = await window.showSaveFilePicker({ suggestedName: this.fileName() + '.dndsave.json', types: [{ description: 'Character save', accept: { 'application/json': ['.json'] } }] });\n      this._fh = h; this.setState({ fileLinked: true });\n      await this.writeHandle();\n      alert('Auto-save is now linked. Every change writes straight to that file.');\n    } catch (e) { /* cancelled */ }\n  }\n  async openAutoSaveFile() {\n    if (!('showOpenFilePicker' in window)) return;\n    try {\n      const [h] = await window.showOpenFilePicker({ types: [{ description: 'Character save', accept: { 'application/json': ['.json'] } }] });\n      const file = await h.getFile();\n      const d = JSON.parse(await file.text());\n      if (this.applyData(d)) { this._fh = h; this.setState({ fileLinked: true }); alert('Loaded that file. Auto-save is now linked to it.'); }\n      else alert('That file did not contain a character save.');\n    } catch (e) { /* cancelled or bad file */ }\n  }\n  patch(p) { this.setSheet({ ...this.state.sheet, ...p }); }\n\n  // sheet field setters\n  setScore(k, v) { const s = this.state.sheet; this.patch({ scores: { ...s.scores, [k]: v } }); }\n  toggleSave(k) { const s = this.state.sheet; this.patch({ saves: { ...s.saves, [k]: !s.saves[k] } }); }\n  toggleSkill(k) { const s = this.state.sheet; const cur = Number(s.skills[k]) || 0; this.patch({ skills: { ...s.skills, [k]: (cur + 1) % 3 } }); }\n  setCoin(k, v) { const s = this.state.sheet; this.patch({ coins: { ...s.coins, [k]: v } }); }\n  bumpInsp(d) { const s = this.state.sheet; this.patch({ inspiration: Math.max(0, (Number(s.inspiration) || 0) + d) }); }\n  bumpPB(d) {\n    const s = this.state.sheet; const nv = Math.max(0, (Number(s.pb) || 0) + d);\n    const sheet = { ...s, pb: nv }; this.setState({ sheet }); this.saveSheet(sheet); this.clampTypesToPB(nv);\n  }\n  bumpHp(d) {\n    const s = this.state.sheet; const max = Number(s.maxHp); let nv = (Number(s.curHp) || 0) + d;\n    nv = Math.max(0, nv); if (!isNaN(max) && max > 0) nv = Math.min(max, nv);\n    this.patch({ curHp: nv });\n  }\n  bumpTemp(d) { const s = this.state.sheet; this.patch({ tempHp: Math.max(0, (Number(s.tempHp) || 0) + d) }); }\n  setDeath(field, i) { const s = this.state.sheet; const cur = Number(s[field]) || 0; const nv = (cur === i + 1) ? i : i + 1; this.patch({ [field]: nv }); }\n  addClass() { const s = this.state.sheet; this.patch({ classes: [...s.classes, { id: this.uid('c'), name: '', level: '' }] }); }\n  updateClass(id, f, v) { const s = this.state.sheet; this.patch({ classes: s.classes.map(c => c.id === id ? { ...c, [f]: v } : c) }); }\n  removeClass(id) { const s = this.state.sheet; const rest = s.classes.filter(c => c.id !== id); this.patch({ classes: rest.length ? rest : [{ id: this.uid('c'), name: '', level: '' }] }); }\n  addItem(kind) { const s = this.state.sheet; this.patch({ items: [...s.items, { id: this.uid('i'), kind, name: '', atk: '', damage: '' }] }); }\n  updateItem(id, f, v) { const s = this.state.sheet; this.patch({ items: s.items.map(it => it.id === id ? { ...it, [f]: v } : it) }); }\n  removeItem(id) { const s = this.state.sheet; this.patch({ items: s.items.filter(it => it.id !== id) }); }\n  addProf() { const s = this.state.sheet; this.patch({ otherProf: [...s.otherProf, { id: this.uid('p'), text: '' }] }); }\n  updateProf(id, v) { const s = this.state.sheet; this.patch({ otherProf: s.otherProf.map(p => p.id === id ? { ...p, text: v } : p) }); }\n  removeProf(id) { const s = this.state.sheet; this.patch({ otherProf: s.otherProf.filter(p => p.id !== id) }); }\n  setSpellField(f, v) { const s = this.state.sheet; this.patch({ spell: { ...s.spell, [f]: v } }); }\n  setSlotTotal(level, v) {\n    const s = this.state.sheet; let t = parseInt(v, 10); if (isNaN(t)) t = 0; t = Math.max(0, t);\n    const cur = s.spell.slots[level] || { t: 0, e: 0 };\n    this.patch({ spell: { ...s.spell, slots: { ...s.spell.slots, [level]: { t, e: Math.min(cur.e, t) } } } });\n  }\n  toggleSlot(level, i) {\n    const s = this.state.sheet; const cur = s.spell.slots[level] || { t: 0, e: 0 };\n    let nv = (cur.e === i + 1) ? i : i + 1; nv = Math.max(0, Math.min(cur.t, nv));\n    this.patch({ spell: { ...s.spell, slots: { ...s.spell.slots, [level]: { ...cur, e: nv } } } });\n  }\n  addSpell(level) { const s = this.state.sheet; this.patch({ spell: { ...s.spell, list: [...s.spell.list, { id: this.uid('sp'), level, name: '', prepared: false }] } }); }\n  updateSpell(id, f, v) { const s = this.state.sheet; this.patch({ spell: { ...s.spell, list: s.spell.list.map(sp => sp.id === id ? { ...sp, [f]: v } : sp) } }); }\n  removeSpell(id) { const s = this.state.sheet; this.patch({ spell: { ...s.spell, list: s.spell.list.filter(sp => sp.id !== id) } }); }\n\n  clearAll() {\n    if (!confirm('Clear EVERYTHING? This erases your whole character sheet and all abilities. This cannot be undone.')) return;\n    const sheet = this.blankSheet();\n    this.setState({ sheet, types: [], editMode: true, addMenuFor: null });\n    this.saveSheet(sheet); this.save([]);\n  }\n\n  renderVals() {\n    const { editMode, addMenuFor, types } = this.state;\n    const s = this.state.sheet;\n    const dense = this.props.denseMode ?? false;\n    const trackedFirst = this.props.sortTrackedFirst ?? false;\n    const confirmDel = this.props.confirmOnDelete ?? true;\n    const self = this;\n    const locked = !editMode;\n\n    const modOf = k => { const sc = Number(s.scores[k]); return Math.floor(((isNaN(sc) ? 10 : sc) - 10) / 2); };\n    const fmt = m => (m >= 0 ? '+' : '') + m;\n    const pb = Number(s.pb) || 0;\n\n    // ----- Tome view model -----\n    const TL = types.length;\n    const vtypes = types.map((t, ti) => {\n      const L = t.abilities.length;\n      let abs = t.abilities.map((a, i) => ({\n        ...a,\n        editMode, viewMode: !editMode, showExpl: !dense && !!a.explanation,\n        noUp: i === 0, noDown: i === L - 1,\n        moveUp: () => self.moveAbility(t.id, a.id, -1),\n        moveDown: () => self.moveAbility(t.id, a.id, 1),\n        isOpen: a.hasCounter && a.noMax,\n        isCapped: a.hasCounter && !a.noMax,\n        maxLocked: !!a.maxIsPB,\n        maxUnlocked: (a.hasCounter && !a.noMax) && !a.maxIsPB,\n        pbVal: pb,\n        pbBtnLabel: a.maxIsPB ? 'Remove as Proficiency Bonus' : 'Set max = Proficiency Bonus',\n        toggleMaxPB: () => self.setMaxPB(t.id, a.id, !a.maxIsPB),\n        display: (a.hasCounter && a.noMax) ? String(a.amount) : (a.amount + ' / ' + a.max),\n        incAmount: () => self.updateAbility(t.id, a.id, x => ({ ...x, amount: x.noMax ? x.amount + 1 : Math.min(x.max, x.amount + 1) })),\n        decAmount: () => self.updateAbility(t.id, a.id, x => ({ ...x, amount: Math.max(0, x.amount - 1) })),\n        resetAmount: () => self.updateAbility(t.id, a.id, x => ({ ...x, amount: x.max })),\n        incMax: () => self.updateAbility(t.id, a.id, x => ({ ...x, max: x.max + 1 })),\n        decMax: () => self.updateAbility(t.id, a.id, x => { const m = Math.max(0, x.max - 1); return { ...x, max: m, amount: Math.min(x.amount, m) }; }),\n        onName: (e) => self.updateAbility(t.id, a.id, x => ({ ...x, name: e.target.value })),\n        onExpl: (e) => self.updateAbility(t.id, a.id, x => ({ ...x, explanation: e.target.value })),\n        onMaxInput: (e) => { let v = parseInt(e.target.value, 10); if (isNaN(v)) v = 0; v = Math.max(0, v); self.updateAbility(t.id, a.id, x => ({ ...x, max: v, amount: Math.min(x.amount, v) })); },\n        onDelete: () => { if (confirmDel && !confirm('Delete this ability?')) return; self.deleteAbility(t.id, a.id); }\n      }));\n      if (trackedFirst) abs = abs.slice().sort((x, y) => (y.hasCounter ? 1 : 0) - (x.hasCounter ? 1 : 0));\n      return {\n        ...t, abilities: abs, editMode, viewMode: !editMode,\n        noUp: ti === 0, noDown: ti === TL - 1,\n        moveUp: () => self.moveType(t.id, -1),\n        moveDown: () => self.moveType(t.id, 1),\n        showAddMenu: editMode && addMenuFor === t.id,\n        showAddButton: editMode && addMenuFor !== t.id,\n        onRename: (e) => self.renameType(t.id, e.target.value),\n        onDelete: () => { if (confirmDel && !confirm('Delete this entire category and all its abilities?')) return; self.deleteType(t.id); },\n        openAddMenu: () => self.setState({ addMenuFor: t.id }),\n        cancelAdd: () => self.setState({ addMenuFor: null }),\n        addTracked: () => self.addAbility(t.id, true, false),\n        addOpen: () => self.addAbility(t.id, true, true),\n        addSimple: () => self.addAbility(t.id, false, false),\n      };\n    });\n\n    // ----- Sheet view model -----\n    const scores = this.ABILS().map(([k, label]) => ({ key: k, label, score: s.scores[k], mod: fmt(modOf(k)), onScore: (e) => self.setScore(k, e.target.value) }));\n    const saves = this.ABILS().map(([k, label]) => { const tot = modOf(k) + (s.saves[k] ? pb : 0); return { key: k, label, prof: !!s.saves[k], val: fmt(tot), onToggle: editMode ? () => self.toggleSave(k) : undefined }; });\n    const skillBonus = lv => (lv === 2 ? 2 * pb : (lv >= 1 ? pb : 0));\n    const skills = this.SKILLS().map(([k, label, ab]) => { const lv = Number(s.skills[k]) || 0; const tot = modOf(ab) + skillBonus(lv); return { key: k, label, ability: ab.toUpperCase(), level: lv, profOnly: lv === 1, exp: lv === 2, val: fmt(tot), onToggle: editMode ? () => self.toggleSkill(k) : undefined }; });\n    const perTot = modOf('wis') + skillBonus(Number(s.skills.perception) || 0);\n    const passivePerception = 10 + perTot;\n\n    const classes = s.classes.map(c => ({ ...c, canRemove: editMode && s.classes.length > 1, onName: (e) => self.updateClass(c.id, 'name', e.target.value), onLevel: (e) => self.updateClass(c.id, 'level', e.target.value), onRemove: () => self.removeClass(c.id) }));\n    const coins = [['cp','CP'],['sp','SP'],['ep','EP'],['gp','GP'],['pp','PP']].map(([k, label]) => ({ key: k, label, val: s.coins[k], onChange: (e) => self.setCoin(k, e.target.value) }));\n    const items = s.items.map(it => ({ ...it, isWeapon: it.kind === 'weapon', kindLabel: it.kind === 'weapon' ? 'Weapon' : 'Gear', onName: (e) => self.updateItem(it.id, 'name', e.target.value), onAtk: (e) => self.updateItem(it.id, 'atk', e.target.value), onDamage: (e) => self.updateItem(it.id, 'damage', e.target.value), onRemove: () => self.removeItem(it.id) }));\n    const otherProf = s.otherProf.map(p => ({ ...p, onChange: (e) => self.updateProf(p.id, e.target.value), onRemove: () => self.removeProf(p.id) }));\n    const deathSucc = [0,1,2].map(i => ({ fill: i < (Number(s.deathSuccess) || 0), onClick: () => self.setDeath('deathSuccess', i) }));\n    const deathFail = [0,1,2].map(i => ({ fill: i < (Number(s.deathFail) || 0), onClick: () => self.setDeath('deathFail', i) }));\n\n    let groups = [];\n    for (let lv = 0; lv <= 9; lv++) {\n      const hasSlots = lv >= 1;\n      const slot = s.spell.slots[lv] || { t: 0, e: 0 };\n      const spells = s.spell.list.filter(sp => sp.level === lv).map(sp => ({ ...sp, showPrepared: hasSlots, togglePrepared: () => self.updateSpell(sp.id, 'prepared', !sp.prepared), onName: (e) => self.updateSpell(sp.id, 'name', e.target.value), onRemove: () => self.removeSpell(sp.id) }));\n      if (!editMode && spells.length === 0 && !(hasSlots && slot.t > 0)) continue;\n      const pips = hasSlots ? Array.from({ length: slot.t }).map((_, i) => ({ fill: i < slot.e, onClick: () => self.toggleSlot(lv, i) })) : [];\n      groups.push({ level: lv, label: lv === 0 ? 'Cantrips' : ('Level ' + lv), hasSlots, total: slot.t, pips, spells, addSpell: () => self.addSpell(lv) });\n    }\n\n    const classSummary = s.classes.map(c => (c.name || '').trim() ? ((c.name).trim() + (String(c.level || '').trim() ? ' ' + String(c.level).trim() : '')) : '').filter(Boolean).join(' / ');\n    const subParts = [classSummary, (s.race || '').trim()].filter(Boolean);\n    const sheetVM = {\n      ...s, locked,\n      headerTitle: (s.charName || '').trim() ? s.charName : 'Character Sheet',\n      hasSub: subParts.length > 0, headerSub: subParts.join(' \\u2022 '),\n      classes, scores, saves, skills, passivePerception,\n      inspiration: Number(s.inspiration) || 0, pbLabel: fmt(pb),\n      coins, items, otherProf, deathSucc, deathFail,\n      onCharName: (e) => self.patch({ charName: e.target.value }),\n      onBackground: (e) => self.patch({ background: e.target.value }),\n      onPlayerName: (e) => self.patch({ playerName: e.target.value }),\n      onRace: (e) => self.patch({ race: e.target.value }),\n      onAlignment: (e) => self.patch({ alignment: e.target.value }),\n      onXp: (e) => self.patch({ xp: e.target.value }),\n      addClass: () => self.addClass(),\n      incInsp: () => self.bumpInsp(1), decInsp: () => self.bumpInsp(-1),\n      incPB: () => self.bumpPB(1), decPB: () => self.bumpPB(-1),\n      onAc: (e) => self.patch({ ac: e.target.value }),\n      onInitiative: (e) => self.patch({ initiative: e.target.value }),\n      onSpeed: (e) => self.patch({ speed: e.target.value }),\n      onMaxHp: (e) => self.patch({ maxHp: e.target.value }),\n      onHitDice: (e) => self.patch({ hitDice: e.target.value }),\n      incHp: () => self.bumpHp(1), decHp: () => self.bumpHp(-1),\n      incTemp: () => self.bumpTemp(1), decTemp: () => self.bumpTemp(-1),\n      addWeapon: () => self.addItem('weapon'), addEquipment: () => self.addItem('equipment'),\n      addProf: () => self.addProf(),\n      onPersonality: (e) => self.patch({ personality: e.target.value }),\n      onIdeals: (e) => self.patch({ ideals: e.target.value }),\n      onBonds: (e) => self.patch({ bonds: e.target.value }),\n      onFlaws: (e) => self.patch({ flaws: e.target.value }),\n      spell: {\n        ...s.spell, groups,\n        onCls: (e) => self.setSpellField('cls', e.target.value),\n        onAbility: (e) => self.setSpellField('ability', e.target.value),\n        onSaveDC: (e) => self.setSpellField('saveDC', e.target.value),\n        onAtk: (e) => self.setSpellField('atk', e.target.value),\n      }\n    };\n    // attach slot-total handlers per group\n    groups.forEach(g => { g.onTotal = (e) => self.setSlotTotal(g.level, e.target.value); });\n\n    return {\n      editMode, viewMode: !editMode,\n      types: vtypes, sheet: sheetVM,\n      editLabel: editMode ? 'Done' : 'Edit',\n      toggleEdit: () => this.setState(st => ({ editMode: !st.editMode, addMenuFor: null })),\n      addType: () => this.addType(),\n      clearAll: () => this.clearAll(),\n      supportsFS: (typeof window !== 'undefined') && ('showSaveFilePicker' in window),\n      fileLinked: this.state.fileLinked,\n      downloadBackup: () => this.downloadBackup(),\n      restoreFromInput: (e) => this.restoreFromInput(e),\n      linkAutoSaveFile: () => this.linkAutoSaveFile(),\n      openAutoSaveFile: () => this.openAutoSaveFile(),\n    };\n  }\n\n  getDefault() {\n    const T = (name, abilities) => ({ id: this.uid('t'), name, abilities });\n    const S = (name, explanation) => ({ id: this.uid('a'), name, explanation, hasCounter: false, amount: 0, max: 0 });\n    const C = (name, amount, max, explanation) => ({ id: this.uid('a'), name, explanation, hasCounter: true, noMax: false, maxIsPB: false, amount, max });\n    const O = (name, amount, explanation) => ({ id: this.uid('a'), name, explanation, hasCounter: true, noMax: true, maxIsPB: false, amount, max: 0 });\n    return [\n      T('Rogue', [\n        S('Expertise', 'Gain Expertise in two of your skill proficiencies (Sleight of Hand and Stealth recommended). At Rogue level 6, gain Expertise in two more.'),\n        S('Sneak Attack', \"Once per turn, deal an extra 1d6 (scales with level) to a creature you hit with an attack roll, if you have Advantage and the attack uses a Finesse or Ranged weapon. No Advantage needed if an ally is within 5 ft of the target, the ally isn't Incapacitated, and you don't have Disadvantage. Same damage type as the weapon.\"),\n        S(\"Thieves' Cant\", \"You know Thieves' Cant and one other language of your choice.\"),\n        S('Weapon Mastery', 'Use the mastery properties of two kinds of weapons you are proficient with (e.g. Daggers and Shortbows). You can change the chosen weapons after each Long Rest.'),\n        S('Cunning Action', 'On your turn, take Dash, Disengage, or Hide as a Bonus Action.'),\n        S('Rogue Subclass', 'You gain a Rogue subclass and each of its features that are of your Rogue level or lower.'),\n        S('Steady Aim', 'As a Bonus Action, give yourself Advantage on your next attack roll this turn. Only usable if you have not moved this turn; your Speed becomes 0 until end of turn.'),\n        S('Cunning Strike', 'When you deal Sneak Attack damage, forgo dice to add an effect. Save DC = 8 + Dex mod + PB. Poison (1d6): Con save or Poisoned 1 min, repeating the save at end of each turn (needs a Poisoner\\u2019s Kit). Trip (1d6): Large or smaller, Dex save or Prone. Withdraw (1d6): move up to half your Speed without provoking Opportunity Attacks.'),\n        S('Uncanny Dodge', 'When an attacker you can see hits you, use your Reaction to halve the attack\\u2019s damage (round down).'),\n        S('Pyrotechnics', 'Adept at crafting explosives and pyrotechnics from simple ingredients. You gain proficiency with magitech firearms and two related tools.'),\n        C('Spellbombs', 8, 8, 'Hanabi points = your Rogue level, regained on a Long Rest. Over 10 min, store one spell from the Tamaya Spellbombs table in an armed spellbomb (cost in hanabi points). Spellbombs weigh \\u00bd lb and disintegrate on your next Long Rest. Bonus Action to throw up to 60 ft; Reaction to detonate within 60 ft. Intelligence is your spellbomb ability \\u2014 save DC = 8 + PB + Int mod.'),\n        S('Evasion', 'When subjected to an effect allowing a Dex save for half damage, take no damage on a success and half on a failure. Cannot be used while Incapacitated.'),\n        S('Reliable Talent', 'When you make an ability check using a skill or tool proficiency, treat a d20 roll of 9 or lower as a 10.'),\n      ]),\n      T('Goliath', [\n        S('Large Form', 'At character level 5, change your size to Large as a Bonus Action if there is room. Lasts 10 min or until you end it. Advantage on Strength checks and +10 ft Speed. Once per Long Rest.'),\n        S('Powerful Build', 'Advantage on ability checks to end the Grappled condition. Count as one size larger for carrying capacity.'),\n        C('Giant Ancestry', 0, 3, 'Descended from Giants. Choose a supernatural boon; uses = your Proficiency Bonus, regained on a Long Rest.'),\n        S(\"Fire's Burn\", 'Your chosen Giant Ancestry boon: when you hit a target and deal damage, also deal 1d10 Fire damage to it.'),\n      ]),\n      T('Ammunition Mastery', [\n        C('Tinkered Artillery', 2, 3, 'On a short or long rest, modify pieces of ammunition equal to your PB. Poisonous: +1d6 poison and Con save or Poisoned until end of your next turn. Whomping: Str save or knocked Prone. Use a modified piece on an Ammunition weapon attack against a target within normal range. Specialised ammo deteriorates 24 hrs after creation.'),\n        S('Hail of Ammunition', 'Loose a volley at a point within your weapon\\u2019s normal range. Each creature in a 10-ft-radius sphere makes a Dex save, taking piercing damage = PB d6 on a fail, half on a success. Requires at least 10 pieces of drawable ammunition.'),\n      ]),\n      T('Finesse Mastery', [\n        S('Nimble Duelist', 'When you hit a creature with a melee attack using a Finesse weapon, it can\\u2019t make opportunity attacks against you until end of turn.'),\n        S('Skewer', 'Make an attack roll against a creature within reach; on a hit it suffers the normal effects and is Grappled by you. The grapple ends if you attack with the weapon again or let go. When it ends, the creature takes piercing damage = PB d8.'),\n      ]),\n      T('Prostheses & Arms', [\n        C('Draakannon', 4, 4, 'This prosthesis has 4 charges, regaining all at dawn. Replaces or enhances an arm. Has the Blast (1d6 fire, 20 ft) property and the Piercing Shot superior strike.'),\n        S('Draconic Versatility', 'As an action while wearing the Draakannon, change its Blast damage type to acid, cold, fire, lightning, or poison.'),\n        S('Blast Zone', 'When using Blast to propel yourself, expend 1 charge for extra firepower: each creature within 5 ft makes a DC 13 Dex save, taking 1d6 of the Blast\\u2019s type on a fail, half on a success.'),\n        C('Onikiri, Demon Cutter', 3, 4, 'This sword has 4 charges, regaining 1d4 at dawn. While holding it you can cast the Light cantrip on the blade at will.'),\n        S('Radiant Wrath', 'Bonus Action, expend 1 charge: imbue the sword with radiant energy until end of your next turn (+1d6 radiant per hit). The first hit each turn forces each Fiend within 10 ft of the target to make a DC 15 Dex save or take 2d6 radiant.'),\n        S('Demon Lure', 'Bonus Action, expend 2 charges: a creature within 30 ft makes a DC 15 Wis save (Fiends with disadvantage). On a fail it is fixated on you for 1 min \\u2014 Incapacitated, Speed 0. Ends if you attack another creature, cast a spell, move more than 30 ft away, or it takes damage from you or an ally.'),\n      ]),\n      T('Weapons', [\n        C('Revolver', 4, 6, 'Magitech firearm. Damage 2d8.'),\n        S('Rapier', 'Finesse martial weapon. Damage 1d8.'),\n      ]),\n      T('Feats', [\n        S('Prostheses Fighting', \"Master of wielding prostheses in battle: +10 ft range on attacks using a Blast or Launch property; +5 ft reach on melee attacks using prostheses with the Melee property; one extra damage die when you hit using a prosthesis\\u2019 Blast, Launch, or Melee property.\"),\n        S('Punch and Grab (Grappler)', 'When you hit with an Unarmed Strike as part of the Attack action, use both the Damage and the Grapple option. Once per turn.'),\n        S('Attack Advantage (Grappler)', 'Advantage on attack rolls against a creature Grappled by you.'),\n        S('Fast Wrestler (Grappler)', 'No extra movement to move a creature you have Grappled if it is your size or smaller.'),\n      ]),\n      T('Spells', [\n        O('Sleep', 0, 'Each creature of your choice in a 5-ft-radius sphere within range makes a Wis save or has the Incapacitated condition until the end of its next turn, then repeats the save. On a second failure it is Unconscious for the duration. Ends on a target that takes damage or that someone shakes awake. Creatures that don\\u2019t sleep or are immune to Exhaustion automatically succeed.'),\n        O('Shatter', 0, 'A loud noise erupts within range. Each creature in a 10-ft-radius sphere makes a Con save, taking 3d8 Thunder on a fail, half on a success. Constructs have Disadvantage. Unattended nonmagical objects in the area also take the damage.'),\n        O('Spike Growth', 0, 'The ground in a 20-ft-radius sphere sprouts spikes and thorns, becoming Difficult Terrain. A creature takes 2d4 Piercing for every 5 ft it travels in the area. The transformation is camouflaged; a creature that can\\u2019t see it must Search and beat your spell save DC to spot the hazard before entering.'),\n        O('Fog Cloud', 0, 'Create a 20-ft-radius sphere of fog within range; it is Heavily Obscured. Lasts the duration or until strong wind disperses it. At higher levels, the radius increases by 20 ft per slot level above 1.'),\n      ]),\n    ];\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
